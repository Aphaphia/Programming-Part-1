name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check /docs folder exists
        run: |
          if [ ! -d "./docs" ]; then
            echo "❌ ERROR: /docs folder not found!"
            exit 1
          fi
          echo "✅ /docs folder exists."
      
      - name: Check required files in /docs
        run: |
          REQUIRED_FILES=("api_endpoint_plan.md" "raceday_erd.pdf" "schema.sql")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "./docs/$file" ]; then
              echo "❌ ERROR: Missing required file: docs/$file"
              exit 1
            fi
            echo "✅ Found docs/$file"
          done
      
      - name: Verify SQL file
        run: |
          if [ -f "./docs/schema.sql" ]; then
            echo "✅ SQL file exists"
            # Check if it has INSERT statements
            if grep -q "INSERT INTO" ./docs/schema.sql; then
              echo "✅ Found sample data in SQL file"
            else
              echo "⚠️  Warning: No INSERT statements found (sample data might be missing)"
            fi
          fi
      
      - name: All validations passed
        run: echo "✅ Repository structure validation complete!"
